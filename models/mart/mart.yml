version: 2

models:
  - name: dim_date
    description: Calendar dimension; also the MetricFlow daily time spine (metric_time).
    time_spine:
      standard_granularity_column: date_day
    columns:
      - {name: date_day, granularity: day, data_tests: [unique, not_null]}
      - {name: date_key, data_tests: [unique, not_null]}

  - name: dim_device
    columns:
      - {name: device_key,  data_tests: [unique, not_null]}
      - {name: device_name, data_tests: [unique, not_null]}

  - name: dim_campaign
    description: One row per campaign across all campaign types (teaser, online_placement, ...).
    columns:
      - {name: campaign_key,  data_tests: [unique, not_null]}
      - name: campaign_type
        data_tests: [not_null]
      - name: gender
        description: Target gender of the campaign (tracking has no user gender). 'Mixed' = flights for several genders.
        data_tests:
          - accepted_values:
              arguments: {values:  ['Female', 'Male', 'Kids','Babys','Unisex', 'All','Mixed', 'Unknown']}

  - name: fct_campaign_benchmark_daily
    description: Expected CTR per campaign/day (online placements only).
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [campaign_key, date_day]}
    columns:
      - name: benchmark_ctr
        data_tests:
          - expression_is_true:
              arguments: {expression: "benchmark_ctr between 0 and 1"}

  - name: fct_campaign_performance_daily
    description: Grain = business date x campaign x device. Additive measures only.
    config: {contract: {enforced: true}}
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [event_date, campaign_key, device_key]}
    columns:
      - {name: date_key,     data_type: integer, data_tests: [not_null]}
      - name: event_date
        data_type: date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: campaign_key
        data_type: text
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_campaign'), field: campaign_key}}
      - name: device_key
        data_type: text
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_device'), field: device_key}}
      - name: impressions
        data_type: bigint
        data_tests:
          - expression_is_true: {arguments: {expression: "impressions >= 0"}}
      - name: clicks
        data_type: bigint
        data_tests:
          - expression_is_true:
              arguments: {expression: "clicks >= 0"}
          - expression_is_true:
              arguments: {expression: "clicks <= impressions"}
              config: {severity: warn}
      - {name: processed_at, data_type: timestamp}

  - name: agg_campaign_performance_daily
    description: >
      Dashboard table. Grain = date x campaign x device. Roll up CTR as sum(clicks)/sum(impressions) and
      benchmark CTR as sum(benchmark_expected_clicks)/sum(benchmark_impressions).
    config: {contract: {enforced: true}}
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [event_date, campaign_key, device]}
    columns:
      - {name: event_date,                 data_type: date, data_tests: [not_null]}
      - {name: date_key,                   data_type: integer}
      - {name: campaign_key,               data_type: text, data_tests: [not_null]}
      - {name: campaign_id,                data_type: text}
      - {name: campaign_name,              data_type: text, data_tests: [not_null]}
      - {name: campaign_type,              data_type: text}
      - {name: gender,                     data_type: text, data_tests: [not_null]}
      - {name: device,                     data_type: text, data_tests: [not_null]}
      - {name: impressions,                data_type: bigint}
      - {name: clicks,                     data_type: bigint}
      - {name: ctr,                        data_type: double precision}
      - {name: benchmark_ctr,              data_type: double precision}
      - {name: benchmark_impressions,      data_type: bigint}
      - {name: benchmark_expected_clicks,  data_type: double precision}
      - {name: benchmark_matched_clicks,   data_type: bigint}
      - {name: ctr_vs_benchmark_index,     data_type: double precision}
